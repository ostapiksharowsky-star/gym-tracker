<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Зал</title>
  <meta name="description" content="Особистий трекер тренувань у залі">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Зал">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/styles.css">
  <script>
    // Застосовуємо збережену тему ще до завантаження застосунку, щоб екран не блимав.
    try {
      var t = localStorage.getItem('gt-theme');
      var a = localStorage.getItem('gt-accent');
      var r = document.documentElement;
      if (t === 'light' || t === 'dark') r.dataset.theme = t;
      if (a === 'mono') r.dataset.accent = 'mono';
      else if (/^#[0-9a-f]{6}$/i.test(a || '')) r.style.setProperty('--accent', a);
    } catch (e) {}
  </script>
</head>
<body>
  <div id="app"></div>
  <noscript><p style="padding:24px">Для роботи застосунку потрібен JavaScript.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
